<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="ga-tile" x1="20" y1="16" x2="104" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="55%" stop-color="#0B57D0" />
      <stop offset="100%" stop-color="#0842A0" />
    </linearGradient>
    <linearGradient id="ga-alert" x1="84" y1="14" x2="112" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F25549" />
      <stop offset="100%" stop-color="#D93025" />
    </linearGradient>
    <filter id="ga-shadow" x="8" y="10" width="112" height="114" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#062E6F" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Main 92x92 squircle within CWS 96x96 safe zone -->
  <g filter="url(#ga-shadow)">
    <rect x="16" y="20" width="92" height="92" rx="24" fill="url(#ga-tile)" />
    <rect x="16.75" y="20.75" width="90.5" height="90.5" rx="23.25" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
  </g>

  <!-- Subtle envelope flap crease watermark -->
  <path d="M 23 33 L 62 60 L 101 33" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Geometric '@' glyph centered at (61, 66) -->
  <circle cx="60.5" cy="66" r="11.5" stroke="#FFFFFF" stroke-width="7.2" />
  <path
    d="M 72 54.5 V 69.5 C 72 75 75.8 77.8 79.8 77.8 C 85.2 77.8 89 72.4 89 65.5 C 89 49.2 76.4 37.5 60.5 37.5 C 44.6 37.5 32 50.2 32 66 C 32 81.8 44.6 94.5 61 94.5 C 68.8 94.5 75.6 92.1 80.8 88"
    stroke="#FFFFFF"
    stroke-width="7.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Top-right '@tention' Gmail-red alert badge -->
  <circle cx="97" cy="31" r="17" fill="url(#ga-alert)" stroke="#FFFFFF" stroke-width="3.5" />
  <line x1="97" y1="22.5" x2="97" y2="31.5" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" />
  <circle cx="97" cy="37.8" r="2.2" fill="#FFFFFF" />
</svg>
