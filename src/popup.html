<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gmail @tention</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1f1f1f;
        --muted: #5f6368;
        --border: #e0e3e7;
        --pill-bg: #f1f3f4;
        --pill-fg: #3c4043;
        --btn-bg: #0b57d0;
        --btn-fg: #ffffff;
        --btn-hover: #0842a0;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1f20;
          --fg: #e3e3e3;
          --muted: #9aa0a6;
          --border: #3c4043;
          --pill-bg: #2d2f31;
          --pill-fg: #e3e3e3;
          --btn-bg: #a8c7fa;
          --btn-fg: #062e6f;
          --btn-hover: #8ab4f8;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 20px;
        width: 320px;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.5;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .brand img {
        width: 24px;
        height: 24px;
        flex-shrink: 0;
      }

      .title {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }

      .status-pill {
        font-size: 11px;
        font-weight: 500;
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--pill-bg);
        color: var(--pill-fg);
        white-space: nowrap;
      }

      .description {
        margin: 0;
        color: var(--muted);
      }

      .actions {
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }

      .actions[hidden] {
        display: none;
      }

      .btn {
        width: 100%;
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        background: var(--btn-bg);
        color: var(--btn-fg);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }

      .btn:hover {
        background: var(--btn-hover);
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <img src="icons/icon-32.png" alt="" width="24" height="24" />
        <h1 class="title">Gmail @tention</h1>
      </div>
      <span id="status-pill" class="status-pill">Checking</span>
    </header>
    <p id="status-description" class="description">
      Checking active tab status...
    </p>
    <div id="actions-container" class="actions" hidden>
      <button id="reload-button" type="button" class="btn">
        Reload Tab
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
